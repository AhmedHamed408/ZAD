name: zad
description: "ZAD (زاد) - Financial Services & Money Transfer Demo App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  image_path: "assets/images/LOGO.png"
  adaptive_icon_background: "#0A0E1A"
  adaptive_icon_foreground: "assets/images/LOGO.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/LOGO.png
